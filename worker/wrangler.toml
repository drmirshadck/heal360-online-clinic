# One helper per website (one doctor, or several doctors on the same site). Change name, vars and the KV id for each client.
name = "heal360-helper"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = true
keep_vars = true          # a deploy never removes values added in the Cloudflare dashboard

[vars]
ALLOWED_ORIGINS = "https://drmirshadck.github.io"   # the doctor's site, e.g. https://drsample.com,https://www.drsample.com
VAPID_SUBJECT = "mailto:support@arshees.com"
# OWN CALENDAR (no Cal.com): "own". Leave out or "cal" = Cal.com as before.
CALENDAR = "own"
TIMEZONE = "Asia/Kolkata"
CLINIC_NAME = "Heal 360 Online Clinic"
SITE_URL = "https://drmirshadck.github.io/heal360-online-clinic/"
CLINIC_WHATSAPP = "917511136045"
# WhatsApp messages to patients (confirmation, reminders, medicine payment): OFF until the clinic number is Connected and templates are approved (whatsapp-templates.md)
WA_ENABLED = "false"
WA_PHONE_ID = ""             # phone-number id from Meta WhatsApp Manager
EMAIL_PROVIDER = "zeptomail"
EMAIL_FROM = "yourbooking@arshees.com"
ZEPTO_HOST = "cpaas.zoho.com"
RETAIN_DAYS = "365"          # bookings are deleted this many days after the appointment
CHANGE_CUTOFF_HOURS = "2"    # patients can cancel / change time online until this many hours before
# Starting timetable (the doctor changes it later in the dashboard). Type slugs = calSlug in config.js; "fee" (₹) shows in the doctor's payment-check email.
# Doctor emails: add "email" (the doctor's own existing email) to each DOCTORS_JSON entry, or DOCTOR_EMAIL for one doctor.
# Patient emails (mail.js), own calendar only: Zoho ZeptoMail, sender name = CLINIC_NAME, secret ZEPTO_TOKEN
# EMAIL_PROVIDER = "zeptomail"
# EMAIL_FROM = "yourbooking@arshees.com"
# ZEPTO_HOST = "api.zeptomail.com"
# CLINIC_NAME = ""
# SITE_URL = "https://DOMAIN/"
# CLINIC_WHATSAPP = ""
SCHEDULE_JSON = '''{"week":{"1":[["10:00","13:00"],["17:00","20:00"]],"2":[["10:00","13:00"],["17:00","20:00"]],"3":[["10:00","13:00"],["17:00","20:00"]],"4":[["10:00","13:00"],["17:00","20:00"]],"5":[["10:00","13:00"],["17:00","20:00"]],"6":[["10:00","13:00"]],"0":[]},"gap":10,"notice":3,"ahead":30,"types":{"online-video-consultation":{"name":"New consultation","length":30,"confirm":true},"review-consultation":{"name":"Review consultation","length":20,"confirm":true},"clinic-visit":{"name":"Clinic visit","length":15,"confirm":true}}}'''
# Each doctor's "whatsapp" = her own WhatsApp number with country code, digits only (e.g. 919876543210): she gets the booking, reminder and payment messages there.
# Several doctors on one website: list them here (then DOCTOR_NAME / DAILY_ROOM_URL are ignored)
DOCTORS_JSON = '''[{"id":"seena","name":"Dr. Seena Naseem K.A.","email":"","whatsapp":""},{"id":"shameema","name":"Dr. Shameema","email":"","whatsapp":""},{"id":"musheera","name":"Dr. Musheera K.","email":"","whatsapp":""}]'''

[[durable_objects.bindings]]
name = "CALS"
class_name = "Calendar"

[[durable_objects.bindings]]
name = "ROOMS"          # own video: one room per consultation (connection messages only, nothing stored)
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Calendar"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Room"]

[[kv_namespaces]]
binding = "PUSH"
id = "1b5c8608d48f479ab4ec2ad8afd9d4bc"

# Secrets (never in this file):
#   one doctor:  CAL_API_KEY, DAILY_API_KEY, PIN_HASH          -> node make-secrets.mjs <PIN>
#   several:     CAL_KEYS {"id":"key"}, DAILY_KEYS {"id":"key"}, PINS -> node make-secrets.mjs anish=<PIN> second=<PIN>
#   always:      SESSION_SECRET, CAL_WEBHOOK_SECRET, VAPID_PUBLIC_KEY, VAPID_PRIVATE_JWK
#   WhatsApp:    WA_TOKEN (permanent token of the Meta "notifier" user)
#   own calendar: DATA_KEY (encrypts patient details; never change it once bookings exist)
