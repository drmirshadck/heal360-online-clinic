<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Your appointment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<link rel="stylesheet" href="style.css">
<script>document.write('<script src="config.js?v=' + Date.now() + '"><\/script>')</script>
<!-- Patient's own "change or cancel" page (DotCom's own calendar). The link carries a signed token; no login. -->
<style>
  body{background:var(--bg);min-height:100vh}
  .mg{max-width:560px;margin:0 auto;padding:28px 18px 60px}
  .mg-card{background:#fff;border-radius:22px;padding:24px;display:grid;gap:14px;box-shadow:0 20px 50px -34px rgba(0,0,0,.35)}
  .mg h1{font:800 1.5rem var(--display);color:var(--brand-deep)}
  .mg .home{display:inline-block;margin-bottom:14px;color:var(--brand-deep);font-weight:700;text-decoration:none}
  .row{display:flex;gap:10px;flex-wrap:wrap}.row .btn{flex:1;min-width:150px}
  .btn-ghost{background:transparent;color:var(--brand-deep);border:1.5px solid var(--line)}
  .btn-danger{background:#fff;color:#b3261e;border:1.5px solid #f1c9c6}
  .badge{display:inline-block;border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:700;background:var(--soft);color:var(--brand-deep)}
  .badge.no{background:#fdeceb;color:#b3261e}
  textarea{width:100%;min-height:70px;border:1.5px solid var(--line);border-radius:12px;padding:10px;font:inherit}
</style>
</head>
<body>
<div class="mg"><a class="home" href="./" id="home">← Back to website</a><div class="mg-card" id="box"><p class="small">Loading your appointment…</p></div></div>
<script>
(function(){
const S = window.SITE, box = document.getElementById("box");
const r = document.documentElement.style;
r.setProperty("--brand", S.theme.brand); r.setProperty("--brand-deep", S.theme.brandDeep); r.setProperty("--accent", S.theme.accent);
const API = ((S.helper && S.helper.url) || "").replace(/\/$/, "");
const q = new URLSearchParams(location.search), A = { d: q.get("d") || "main", b: q.get("b") || "", t: q.get("t") || "" };
const DOCS = (S.doctors && S.doctors.length) ? S.doctors : [];
const DOC = DOCS.find(x => x.id === A.d) || { name: S.doctor.name };
const TZ = (() => { try { const z = Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Kolkata"; return z === "Asia/Calcutta" ? "Asia/Kolkata" : z; } catch (e) { return "Asia/Kolkata"; } })();
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (iso, o) => new Intl.DateTimeFormat("en-IN", Object.assign({ timeZone: TZ }, o)).format(new Date(iso));
const when = iso => `${fmt(iso, { weekday: "long", day: "numeric", month: "long" })}, ${fmt(iso, { hour: "numeric", minute: "2-digit" })}`;
const ymd = d => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const wa = () => (S.contact && S.contact.whatsapp) ? `https://wa.me/${String(S.contact.whatsapp).replace(/\D/g, "")}` : "";
let bk = null, slots = null, until = "", day = "";
document.title = "Your appointment · " + DOC.name;

async function call(path, opts) {
  const res = await fetch(API + path, opts ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...A, ...opts }) } : undefined);
  const d = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(d.error || "Something went wrong. Please try again."); e.status = res.status; throw e; }
  return d;
}
function contact() { return wa() ? ` <a href="${wa()}" target="_blank" rel="noopener">Message the clinic on WhatsApp</a>.` : ""; }

async function load() {
  if (!API || !A.b || !A.t) { box.innerHTML = `<h1>Link not valid</h1><p>Please use the link you got after booking.${contact()}</p>`; return; }
  try { bk = await call("/book/manage?" + new URLSearchParams(A)); show(); }
  catch (e) { box.innerHTML = `<h1>${e.status === 403 ? "Link not valid" : "Couldn't open your appointment"}</h1><p>${esc(e.message)}${contact()}</p>`; }
}
function show(msg) {
  const st = bk.status, gone = /cancel|declin|expired/.test(st);
  const label = { pending: "Waiting for the clinic to confirm", confirmed: "Confirmed", cancelled: "Cancelled", declined: "Not possible", expired: "Not confirmed in time" }[st] || st;
  box.innerHTML = `<h1>Your appointment</h1>
    ${msg ? `<p style="color:var(--teal);font-weight:700">${esc(msg)}</p>` : ""}
    <div class="summary"><div><span>${esc(bk.title)}${DOCS.length > 1 ? " · " + esc(DOC.name) : ""}</span><b>${esc(when(bk.start))}</b></div><div><span>Patient</span><b>${esc(bk.name)}</b></div><div><span>Status</span><span class="badge${gone ? " no" : ""}">${esc(label)}</span></div></div>
    ${TZ !== "Asia/Kolkata" ? `<p class="small">Times are shown in your time (${esc(TZ.replace(/_/g, " "))}).</p>` : ""}
    ${!gone ? `<p class="small">At your time, join from the <a href="room.html?${A.d !== "main" ? "d=" + encodeURIComponent(A.d) + "&" : ""}b=${encodeURIComponent(A.b)}&t=${encodeURIComponent(A.t)}"><b>Consultation room</b></a>.</p>` : ""}
    ${bk.canChange ? `<div class="row"><button class="btn btn-solid" id="ch">Change time</button><button class="btn btn-danger" id="cx">Cancel appointment</button></div>`
      : (!gone ? `<p class="small">This appointment can no longer be changed online.${contact()}</p>` : `<a class="btn btn-solid" href="./#book">Book a new appointment</a>`)}`;
  const ch = document.getElementById("ch"), cx = document.getElementById("cx");
  if (ch) ch.onclick = () => { slots = null; pick(); };
  if (cx) cx.onclick = cancelAsk;
}
function cancelAsk() {
  box.innerHTML = `<h1>Cancel appointment?</h1><div class="summary"><div><span>${esc(bk.title)}</span><b>${esc(when(bk.start))}</b></div></div>
    <label class="f">Reason (optional)<textarea id="why"></textarea></label>
    <p class="small">If you paid by UPI, the clinic will contact you about a refund.</p><p class="err" id="e"></p>
    <div class="row"><button class="btn btn-ghost" id="no">Keep appointment</button><button class="btn btn-danger" id="yes">Yes, cancel</button></div>`;
  document.getElementById("no").onclick = () => show();
  document.getElementById("yes").onclick = async ev => {
    ev.target.disabled = true;
    try { await call("/book/cancel", { reason: document.getElementById("why").value.trim() }); bk.status = "cancelled"; bk.canChange = false; show("Your appointment is cancelled."); }
    catch (e) { document.getElementById("e").textContent = e.message; ev.target.disabled = false; }
  };
}
async function loadSlots(more) {
  const from = more && until ? until : ymd(new Date());
  const d = await call("/book/slots?" + new URLSearchParams({ d: A.d, slug: bk.slug, from, days: 14, tz: TZ }));
  slots = Object.assign(more ? (slots || {}) : {}, d.slots || {});
  until = ymd(new Date(new Date(from + "T12:00:00").getTime() + 14 * 864e5));
}
async function pick(msg) {
  if (!slots) { box.innerHTML = `<p class="small">Loading free times…</p>`; try { await loadSlots(); } catch (e) { show(); return; } }
  const days = []; const s0 = new Date(); s0.setHours(12, 0, 0, 0);
  const n = Math.round((new Date(until + "T12:00:00") - s0) / 864e5);
  for (let i = 0; i < n; i++) days.push(ymd(new Date(s0.getTime() + i * 864e5)));
  const open = days.filter(d => slots[d] && slots[d].length);
  if (!open.includes(day)) day = open[0] || "";
  box.innerHTML = `<h1>Choose a new time</h1>
    ${msg ? `<p class="err">${esc(msg)}</p>` : ""}
    <div class="summary"><div><span>Now</span><b>${esc(when(bk.start))}</b></div></div>
    <div class="days">${days.map(d => { const has = slots[d] && slots[d].length, dt = new Date(d + "T12:00:00"); return `<button class="chip" data-day="${d}" aria-pressed="${d === day}" ${has ? "" : "disabled"}><small>${dt.toLocaleDateString("en-IN", { weekday: "short" })}</small>${dt.getDate()}<small>${dt.toLocaleDateString("en-IN", { month: "short" })}</small></button>`; }).join("")}</div>
    <button class="btn btn-ghost" id="more" style="justify-self:start">More dates →</button>
    ${day ? `<div class="slots">${slots[day].map(iso => `<button class="chip" data-time="${esc(iso)}">${esc(fmt(iso, { hour: "numeric", minute: "2-digit" }))}</button>`).join("")}</div>` : `<p>No free times in these dates. Tap <b>More dates</b>.</p>`}
    <p class="err" id="e"></p>
    <button class="btn btn-ghost" id="back" style="justify-self:start">Keep current time</button>`;
  box.querySelectorAll("[data-day]").forEach(b => b.onclick = () => { day = b.dataset.day; pick(); });
  box.querySelectorAll("[data-time]").forEach(b => b.onclick = async () => {
    if (!confirm(`Move your appointment to ${when(b.dataset.time)}?`)) return;
    box.querySelectorAll("button").forEach(x => x.disabled = true);
    try { const d = await call("/book/reschedule", { start: b.dataset.time }); bk.start = d.start; show("Your appointment time is changed."); }
    catch (e) { if (e.status === 409) { slots = null; pick(e.message); } else { document.getElementById("e").textContent = e.message; box.querySelectorAll("button").forEach(x => x.disabled = false); } }
  });
  document.getElementById("more").onclick = ev => { ev.target.disabled = true; ev.target.textContent = "Loading…"; loadSlots(true).then(() => pick()).catch(() => { ev.target.textContent = "Couldn't load — try again"; ev.target.disabled = false; }); };
  document.getElementById("back").onclick = () => show();
}
load();
})();
</script>
</body>
</html>
